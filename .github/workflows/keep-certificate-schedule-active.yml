name: Keep certificate schedule active

on:
  schedule:
    # GitHub disables schedules in public repositories after 60 days without
    # repository activity. This records maintenance once each month.
    - cron: '43 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Record monthly certificate maintenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .maintenance
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .maintenance/certificate-schedule-last-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance/certificate-schedule-last-run.txt
          git commit -m 'Record certificate renewal schedule activity'
          git push origin HEAD:main
