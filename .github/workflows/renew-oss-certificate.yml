name: Renew DOSO OSS HTTPS certificate

on:
  schedule:
    # 11:17 Monday in China; off the top of the hour to reduce dropped runs.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = read only; staging = test ACME challenge; production = issue and deploy now'
        type: choice
        options: [check, staging, production]
        default: check

permissions:
  contents: read
  id-token: write

concurrency:
  group: doso-oss-certificate
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.inputs.mode || 'scheduled' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Decide whether a renewal is needed
        id: due
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == staging || "$MODE" == production ]]; then
            python3 automation/oss_certificate.py due --force
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [[ "$MODE" == check ]]; then
            if python3 automation/oss_certificate.py due --days 30; then :; else
              code=$?
              if [[ "$code" -ne 3 ]]; then exit "$code"; fi
            fi
            echo 'run=false' >> "$GITHUB_OUTPUT"
          elif [[ "$MODE" == scheduled ]]; then
            if python3 automation/oss_certificate.py due --days 30; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              code=$?
              if [[ "$code" -ne 3 ]]; then exit "$code"; fi
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Unknown renewal mode: $MODE" >&2
            exit 2
          fi

      - name: Obtain short-lived Alibaba Cloud credentials
        id: aliyun
        if: steps.due.outputs.run == 'true'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_CERT_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800

      - name: Install pinned OSS command line tool
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --silent --show-error \
            -o ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.1/ossutil-2.4.1-linux-amd64.zip
          echo '57ee4c56796a40144acd6b0b96b53b4ba75e5cec09c01d8d0313c09a5524022f  ossutil.zip' | sha256sum -c -
          unzip -q ossutil.zip
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 ossutil-2.4.1-linux-amd64/ossutil "$RUNNER_TEMP/bin/ossutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned Certbot
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/certbot-venv"
          "$RUNNER_TEMP/certbot-venv/bin/python" -m pip install --disable-pip-version-check 'certbot==5.9.0'

      - name: Issue certificate after OSS HTTP validation
        if: steps.due.outputs.run == 'true'
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun.outputs['aliyun-access-key-id'] }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun.outputs['aliyun-access-key-secret'] }}
          OSS_SESSION_TOKEN: ${{ steps.aliyun.outputs['aliyun-security-token'] }}
          ACME_CONTACT_EMAIL: ${{ vars.ACME_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?}"
          : "${OSS_ACCESS_KEY_SECRET:?}"
          : "${OSS_SESSION_TOKEN:?}"
          : "${ACME_CONTACT_EMAIL:?}"
          server=https://acme-v02.api.letsencrypt.org/directory
          if [[ "$MODE" == staging ]]; then
            server=https://acme-staging-v02.api.letsencrypt.org/directory
          fi
          "$RUNNER_TEMP/certbot-venv/bin/certbot" certonly \
            --manual --preferred-challenges http \
            --manual-auth-hook "python3 $GITHUB_WORKSPACE/automation/oss_certificate.py auth" \
            --manual-cleanup-hook "python3 $GITHUB_WORKSPACE/automation/oss_certificate.py cleanup" \
            --non-interactive --agree-tos -m "$ACME_CONTACT_EMAIL" \
            --server "$server" --key-type rsa --rsa-key-size 2048 \
            --config-dir "$RUNNER_TEMP/letsencrypt" \
            --work-dir "$RUNNER_TEMP/letsencrypt-work" \
            --logs-dir "$RUNNER_TEMP/letsencrypt-logs" \
            --cert-name www.dosorobotics.com \
            -d www.dosorobotics.com
          if [[ "$MODE" != staging ]]; then
            python3 automation/oss_certificate.py deploy --config-dir "$RUNNER_TEMP/letsencrypt"
          else
            echo 'STAGING_VALIDATION=passed; no certificate was deployed'
          fi
